name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOCACHE: ${{ github.workspace }}/veil-core/.build/cache
  GOMODCACHE: ${{ github.workspace }}/veil-core/.build/mod

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  cli:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux, arch: amd64}
          - {target: linux, arch: arm64}
          - {target: linux, arch: armv7}
          - {target: windows, arch: amd64}
          - {target: windows, arch: arm64}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          scope: release-cli-${{ matrix.target }}-${{ matrix.arch }}
      - name: Package CLI
        run: python3 veil-service/scripts/package.py --version "$VERSION" --target "$TARGET" --arch "$ARCH" --output-dir "$PWD/.build/release"
      - name: Check Linux installation
        if: matrix.target == 'linux' && matrix.arch == 'amd64'
        run: python3 veil-service/scripts/package_check.py ".build/release/veil-$VERSION-linux-amd64.tar.gz"
      - name: Check Windows payload
        if: matrix.target == 'windows'
        run: python3 veil-service/scripts/windows_package_check.py ".build/release/veil-$VERSION-windows-$ARCH.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-cli-${{ matrix.target }}-${{ matrix.arch }}
          path: .build/release/*
          if-no-files-found: error
          retention-days: 3

  desktop:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux}
          - {os: windows-2025, target: windows}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          scope: release-desktop-${{ matrix.target }}
      - name: Install Linux webview headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Package desktop
        run: python veil-desktop/scripts/package.py --version "$VERSION" --target "$TARGET" --arch amd64 --output-dir "$GITHUB_WORKSPACE/.build/release"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-desktop-${{ matrix.target }}
          path: .build/release/*
          if-no-files-found: error
          retention-days: 3

  routers:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          scope: release-routers
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: openwrt/openwrt
          ref: 7639649c50a13e344d35b447edec3e07505e12e0 # openwrt-24.10
          path: .build/tools/openwrt
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: openwrt/luci
          ref: 7dbe2638f8b10fe33bc9e4fee4966bad8de86089 # openwrt-24.10
          path: .build/tools/luci
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: opnsense/plugins
          ref: 6cb23d364671d7d409f2e9e9a14987efcc8ccc7e # stable/26.7
          path: .build/tools/opnsense
          persist-credentials: false
      - name: Package OpenWrt 24.10 x86_64 and bilingual LuCI
        run: |
          make -C .build/tools/luci/modules/luci-base/src po2lmo
          python3 veil-service/scripts/openwrt_package.py --sdk .build/tools/openwrt --po2lmo .build/tools/luci/modules/luci-base/src/po2lmo --architecture x86_64 --version "$VERSION-1" --output-dir "$PWD/.build/release"
      - name: Bundle OPNsense native package inputs
        run: python3 veil-service/scripts/opnsense_bundle.py --plugins .build/tools/opnsense --version "$VERSION" --output-dir "$PWD/.build/release"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-routers
          path: .build/release/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [version, checks, cli, desktop, routers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-*
          path: .build/release
          merge-multiple: true
      - name: Verify exact release payload and publish
        run: python3 .github/scripts/release.py "$VERSION" .build/release --publish
