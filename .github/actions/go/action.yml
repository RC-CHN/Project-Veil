name: Pinned Go with scoped cache
description: Match the TLS overlay toolchain and keep parallel jobs' caches separate.
inputs:
  scope:
    description: Backend or cross-compilation target
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: .go-version
        cache: false
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          veil-core/.build/mod
          veil-core/.build/cache
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version') }}-${{ inputs.scope }}-${{ hashFiles('veil-core/go.sum', 'veil-service/go.sum') }}-${{ hashFiles('veil-core/**/*.go', 'veil-core/patches/**', 'veil-core/scripts/build.py', 'veil-service/**/*.go', 'veil-service/scripts/build.py') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version') }}-${{ inputs.scope }}-${{ hashFiles('veil-core/go.sum', 'veil-service/go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version') }}-${{ inputs.scope }}-
