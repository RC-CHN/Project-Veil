<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Veil</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/shared/connections.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="#" aria-label="Veil"
          ><span class="mark" aria-hidden="true">V</span>Veil<span
            class="edition"
            >DESKTOP</span
          ></a
        >
        <div class="preferences">
          <button id="theme" class="quiet" data-i18n="theme">Appearance</button
          ><select id="language" aria-label="Language">
            <option value="en">English</option>
            <option value="zh">简体中文</option>
          </select>
        </div>
      </header>
      <main>
        <section class="hero" aria-labelledby="hero-title">
          <div>
            <div class="eyebrow" data-i18n="yourConnection">
              YOUR CONNECTION
            </div>
            <h1 id="hero-title" data-i18n="title">A clear path forward.</h1>
            <p data-i18n="subtitle">Your connection, ready when you are.</p>
          </div>
          <div class="status-pill" id="state">
            <span class="dot"></span><span id="state-text">—</span>
          </div>
        </section>
        <section class="overview" aria-label="Status">
          <div>
            <span data-i18n="localEndpoint">Local endpoint</span
            ><strong id="endpoint">—</strong>
          </div>
          <div>
            <span data-i18n="connections">Accepted connections</span
            ><strong id="accepted">0</strong>
          </div>
          <div>
            <span data-i18n="completed">Completed / failed</span
            ><strong id="completed">0 / 0</strong>
          </div>
        </section>
        <div id="feedback" role="status" aria-live="polite" hidden></div>
        <section id="connection-list" aria-label="Connections"></section>
        <section class="system-proxy" aria-labelledby="system-proxy-title">
          <div>
            <label
              id="system-proxy-title"
              for="proxy-mode"
              data-i18n="systemProxy"
              >System proxy</label
            >
            <p id="proxy-hint"></p>
          </div>
          <div class="actions">
            <select
              id="proxy-connection"
              aria-label="System proxy connection"
            ></select>
            <select id="proxy-mode">
              <option value="keep" data-i18n="proxyKeep">
                Leave unchanged
              </option>
              <option value="auto" data-i18n="proxyAuto">
                Configure automatically
              </option></select
            ><button id="proxy-clear" class="quiet" data-i18n="proxyClear">
              Clear system proxy
            </button>
          </div>
        </section>
        <details class="diagnostics" id="diagnostics">
          <summary data-i18n="diagnostics">Diagnostics</summary>
          <pre id="diagnostic-data"></pre>
        </details>
      </main>
      <footer>
        <span data-i18n="footer">SOCKS5 & HTTP · Local proxy</span>
        <div class="footer-actions">
          <span data-i18n="closing">Closing the window keeps Veil running.</span
          ><button id="quit" class="quiet" data-i18n="quit">Exit Veil</button>
        </div>
      </footer>
    </div>
    <dialog
      id="confirmation"
      aria-labelledby="confirmation-title"
      aria-describedby="confirmation-message"
    >
      <form method="dialog">
        <div class="confirmation-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            width="26"
            height="26"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M12 3v9m-5-7a8 8 0 1 0 10 0" />
          </svg>
        </div>
        <h2 id="confirmation-title"></h2>
        <p id="confirmation-message"></p>
        <p id="confirmation-detail" class="confirmation-detail" hidden></p>
        <div class="confirmation-actions">
          <button id="confirmation-cancel" value="cancel" autofocus></button>
          <button
            id="confirmation-accept"
            value="confirm"
            class="primary"
          ></button>
        </div>
      </form>
    </dialog>
    <script src="i18n.js"></script>
    <script src="/shared/i18n.js"></script>
    <script src="/shared/connections.js"></script>
    <script src="app.js"></script>
  </body>
</html>
