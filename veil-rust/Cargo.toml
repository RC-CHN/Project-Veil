[package]
name = "veil-rust"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
bytes = "=1.12.1"
base64 = "=0.22.1"
ring = "=0.17.14"
socket2 = "=0.6.5"
rand = "=0.9.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.1", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1
